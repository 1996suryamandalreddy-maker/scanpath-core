[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanpath"
version = "0.1.0"
description = "Minimal, pluggable scan-path pipeline: generator -> instrument -> evaluator -> optimizer"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["scanpath"]
